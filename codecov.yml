coverage:
  status:
    project:
      default:
        # Allow small dips in overall coverage between runs.
        threshold: 2%
        # Compare against the base as if the deleted lines never existed, so
        # removing a well-covered module doesn't fail the check when the
        # remaining code keeps its coverage.
        removed_code_behavior: adjust_base
    patch:
      default:
        # New code must be well covered: fail the patch check below 90% of changed
        # lines.
        target: 90%
        threshold: 0%

# The Next.js dashboard (ui/) and the vendored FalkorDB client (vendor/) are not
# part of the Rust crate's unit tests, so they're excluded from coverage reporting.
ignore:
  - "ui"
  - "vendor"
  - "scripts"
