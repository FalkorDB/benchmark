name: Cargo Build & Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only token: the job only checks out and builds/tests the repo (CodeQL hardening).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain: [ stable ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Don't persist the GITHUB_TOKEN in .git/config (zizmor `artipacked`); the job only builds.
          persist-credentials: false

      - name: Set up Rust
        run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}

      - name: Install protobuf compiler
        # Kept explicit to ensure protoc is always available in CI (the prometheus crate's
        # build script needs it).
        run: sudo apt-get install -y protobuf-compiler

      - name: Install just
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: just

      # Every step runs a single `just` recipe so the exact command can be reproduced locally
      # (see the Justfile / .github/copilot-instructions.md).
      - name: Build
        run: just build

      - name: Run Clippy
        run: just clippy

      - name: Test
        run: just test
